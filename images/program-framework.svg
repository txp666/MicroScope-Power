<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc">
<title id="title">MicroScope Power 程序框架</title>
<desc id="desc">RP2040 Core 1 负责 ADS8866 采样和自动量程，通过波形帧队列或两秒滑动统计向 Core 0 交付数据。Core 0 负责启动、WebUSB、OLED、本地控制、电压监测和参数保存。独立浏览器上位机完成校准、分析、绘图与导出。运行采集与空闲监测互斥。</desc>
<defs>
  <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
  <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0d9488"/></marker>
  <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker>
  <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ea580c"/></marker>
</defs>
