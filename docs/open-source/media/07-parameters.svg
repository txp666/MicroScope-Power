font-size="32" font-weight="400" text-anchor="start">LDO 标称设计范围，实际 VOUT 随负载变化</text><path d="M100 770H1140" fill="none" stroke="#ced9df" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"  /><text x="100" y="713" fill="#596c78" font-size="30" font-weight="400" text-anchor="start">外部 ADC</text><text x="410" y="713" fill="#17232b" font-size="33" font-weight="600" text-anchor="start">ADS8866 · 16 bit</text><path d="M100 892H1140" fill="none" stroke="#ced9df" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"  /><text x="100" y="835" fill="#596c78" font-size="30" font-weight="400" text-anchor="start">ADC 参考</text><text x="410" y="835" fill="#17232b" font-size="33" font-weight="600" text-anchor="start">REF3025 · 2.5 V</text><path d="M100 1014H1140" fill="none" stroke="#ced9df" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"  /><text x="100" y="957" fill="#596c78" font-size="30" font-weight="400" text-anchor="start">前端增益</text><text x="410" y="957" fill="#17232b" font-size="33" font-weight="600" text-anchor="start">INA296A3 · 50 V/V</text><path d="M100 1136H1140" fill="none" stroke="#ced9df" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"  /><text x="100" y="1079" fill="#596c78" font-size="30" font-weight="400" text-anchor="start">采样电阻</text><text x="410" y="1079" fill="#17232b" font-size="33" font-weight="600" text-anchor="start">1 Ω / 10 Ω</text><path d="M100 1258H1140" fill="none" stroke="#ced9df" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"  /><text x="100" y="1201" fill="#596c78" font-size="30" font-weight="400" text-anchor="start">理论电流上限</text><text x="410" y="1201" fill="#17232b" font-size="33" font-weight="600" text-anchor="start">50 mA / 5 mA</text><path d="M100 1380H1140" fill="none" stroke="#ced9df" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"  /><text x="100" y="1323" fill="#596c78" font-size="30" font-weight="400" text-anchor="start">理论电流码宽</text><text x="410" y="1323" fill="#17232b" font-size="33" font-weight="600" text-anchor="start">0.763 / 0.0763 µA/码</text><path d="M100 1502H1140" fill="none" stroke="#ced9df" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"  /><text x="100" y="1445" fill="#596c78" font-size="30" font-weight="400" text-anchor="start">总串联电阻</text><text x="410" y="1445" fill="#17232b" font-size="33" font-weight="600" text-anchor="start">11 Ω（两只始终串联）</text><path d="M1260 770H2300" fill="none" stroke="#ced9df" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"  /><text x="1260" y="713" fill="#596c78" font-size="30" font-weight="400" text-anchor="start">主控</text><text x="1570" y="713" fill="#17232b" font-size="33" font-weight="600" text-anchor="start">RP2040 · 双核</text><path d="M1260 892H2300" fill="none" stroke="#ced9df" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"  /><text x="1260" y="835" fill="#596c78" font-size="30" font-weight="400" text-anchor="start">设定 DAC</text><text x="1570" y="835" fill="#17232b" font-size="33" font-weight="600" text-anchor="start">DAC60501 · 12 bit</text><path d="M1260 1014H2300" fill="none" stroke="#ced9df" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"  /><text x="1260" y="957" fill="#596c78" font-size="30" font-weight="400" text-anchor="start">显示</text><text x="1570" y="957" fill="#17232b" font-size="33" font-weight="600" text-anchor="start">1.3 英寸 OLED · 128 × 64</text><path d="M1260 1136H2300" fill="none" stroke="#ced9df" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"  /><text x="1260" y="1079" fill="#596c78" font-size="30" font-weight="400" text-anchor="start">输入供电</text><text x="1570" y="1079" fill="#17232b" font-size="33" font-weight="600" text-anchor="start">USB 5 V · Type-C</text><path d="M1260 1258H2300" fill="none" stroke="#ced9df" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"  /><text x="1260" y="1201" fill="#596c78" font-size="30" font-weight="400" text-anchor="start">通信</text><text x="1570" y="1201" fill="#17232b" font-size="33" font-weight="600" text-anchor="start">WebUSB · Chrome / Edge</text><path d="M1260 1380H2300" fill="none" stroke="#ced9df" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"  /><text x="1260" y="1323" fill="#596c78" font-size="30" font-weight="400" text-anchor="start">低通预设</text><text x="1570" y="1323" fill="#17232b" font-size="33" font-weight="600" text-anchor="start">10 Hz–20 kHz · 一阶</text><path d="M1260 1502H2300" fill="none" stroke="#ced9df" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"  /><text x="1260" y="1445" fill="#596c78" font-size="30" font-weight="400" text-anchor="start">自定义截止频率</text><text x="1570" y="1445" fill="#17232b" font-size="33" font-weight="600" text-anchor="start">1–45000 Hz（受采样率限制）</text><text x="100" y="1640" fill="#596c78" font-size="30" font-weight="400" text-anchor="start">供电标称理论值：VREG ≈ 0.831–4.956 V；VOUT ≈ VREG − 11 Ω × I。</text><text x="100" y="1692" fill="#596c78" font-size="30" font-weight="400" text-anchor="start">100 kSPS 为最高采样配置；理论量程与码宽不等于整机精度。</text><text x="100" y="1744" fill="#596c78" font-size="30" font-weight="400" text-anchor="start">数字低通实际截止频率不超过估算采样率的 45%；原始数据保留。</text></svg>