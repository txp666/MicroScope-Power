cap="round"  /><rect x="1460" y="620" width="100" height="190" rx="2" fill="#ffffff" stroke="#b87528" stroke-width="2"/><text x="1620" y="710" fill="#17232b" font-size="35" font-weight="600" text-anchor="start">R13 · 33 kΩ</text><path d="M1510 810V1040" fill="none" stroke="#b87528" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"  /><path d="M560 1040H740" fill="none" stroke="#147d77" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"  /><rect x="740" y="990" width="350" height="100" rx="2" fill="#ffffff" stroke="#147d77" stroke-width="2"/><text x="915" y="1054" fill="#17232b" font-size="34" font-weight="600" text-anchor="middle">R14 · 20 kΩ</text><path d="M1090 1040H1510" fill="none" stroke="#147d77" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"  /><text x="595" y="994" fill="#147d77" font-size="30" font-weight="600" text-anchor="start">VDAC</text><circle cx="1510" cy="1040" r="7" fill="#315e83"/><text x="1570" y="1030" fill="#315e83" font-size="38" font-weight="600" text-anchor="start">FB ≈ 0.8 V</text><path d="M1510 1040H1260V600H895V540" fill="none" stroke="#315e83" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-315e83)" /><path d="M1510 1040V1130" fill="none" stroke="#315e83" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"  /><rect x="1460" y="1130" width="100" height="150" rx="2" fill="#ffffff" stroke="#315e83" stroke-width="2"/><text x="1620" y="1210" fill="#17232b" font-size="35" font-weight="600" text-anchor="start">R12 · 9.31 kΩ</text><path d="M1510 1280V1320" fill="none" stroke="#315e83" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"  /><path d="M1465 1320H1555M1480 1337H1540M1495 1354H1525" fill="none" stroke="#315e83" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"  /><rect x="100" y="1410" width="2200" height="160" rx="18" fill="#f5f8f9" stroke="#ced9df" stroke-width="2"/><text x="135" y="1460" fill="#147d77" font-size="30" font-weight="600" text-anchor="start">标称理论关系（在 LDO 正常稳压条件下）</text><text x="135" y="1530" fill="#17232b" font-size="55" font-weight="600" text-anchor="start">VREG ≈ 4.956 − 1.65 × VDAC</text><text x="1330" y="1520" fill="#17232b" font-size="38" font-weight="600" text-anchor="start">VDAC 增加 → VREG 降低</text><text x="100" y="1620" fill="#596c78" font-size="30" font-weight="400" text-anchor="start">VOUT ≈ VREG − 11 Ω × I；当前电压读回用于显示，固件未实现 VOUT 的软件 PID 补偿。</text></svg>